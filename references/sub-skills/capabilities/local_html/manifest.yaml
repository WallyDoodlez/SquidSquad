# Tool manifest — local HTML designs
#
# A built-in fallback design tool. Produces visual designs as plain HTML
# files on the local filesystem, openable in any browser. No external
# service, no account, no MCP — always available.

schema_version: 2
id: local_html
display_name: Local HTML
category: design
description: >
  Plain HTML designs produced locally on disk. The designer writes HTML,
  CSS, and reference assets into a per-issue folder; the human opens the
  files directly in a browser to review each iteration.
provider: builtin
docs_url: null
applicable_roles:
  - designer
sub_skill: sub-skill.md
