# Verifier agent sub-skill manifest — unified mode-agnostic manifest
# (PRD-D D5 #10676 introduced as `includes-v2.yml`; PRD-E E6 #10685
# renamed to the canonical `includes.yml`). No mode-conditional
# sections; wake-mode selection is a runtime concern handled by
# `common/boot-bootstrap` at session start, not a compose-time
# concern. Per TRD §6.5.
#
# Compose reads this file via `_load_manifest_v2(role_class)` (no
# wake_mode arg). The legacy v1 split (`includes.yml` polling +
# `includes-events.yml` events) was retired in E6.
#
# Uses slim variants for vault-protocol and improvement-scan (read-only role).
#
# Order matters — includes are resolved top-to-bottom.
includes:
  - common/cycle-runner
  - common/context-pressure
  - common/task-pickup
  - roles/verifier/verification
  - common/improvement-scan-slim
  - roles/verifier/issue-filing
  - roles/verifier/discussion-protocol
  - common/vault-protocol-slim
  - common/self-restart
  - common/agent-lifecycle
  # Removed in #11087 (post-#11049 D1-inlined; content lives in
  # references/roles/verifier/instructions.md with #10360-cleanup markers):
  #   roles/verifier/file-conventions, roles/verifier/status-line,
  #   roles/verifier/prohibitions, common/agent-boundaries,
  #   roles/verifier/responsibility.
