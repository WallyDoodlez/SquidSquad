# Worker agent sub-skill manifest — unified mode-agnostic manifest
# (PRD-D D5 #10676 introduced as `includes-v2.yml`; PRD-E E6 #10685
# renamed to the canonical `includes.yml`). No mode-conditional
# sections; wake-mode selection is a runtime concern handled by
# `common/boot-bootstrap` at session start, not a compose-time
# concern. Per TRD §6.5.
#
# Compose reads this file via `_load_manifest_v2(role_class)` (no
# wake_mode arg). The legacy v1 split (`includes.yml` polling +
# `includes-events.yml` events) was retired in E6.
#
# Mode-specific fragments (`roles/worker/ralph-loop-overview`, the six
# `common-events/*` fragments) are Read at runtime by `common/boot-bootstrap`,
# NOT inlined at compose time. The composed CLAUDE.md is identical regardless
# of which wake mode the agent eventually probes into at boot.
#
# Order matters — includes are resolved top-to-bottom.
includes:
  - common/boot-bootstrap
  - common/cycle-runner
  - common/context-pressure
  - common/resume-working-state
  - common/interval-sync
  - roles/worker/triage-issues
  - roles/worker/implement-tasks
  - common/pickup-comment-fidelity
  - common/improvement-scan
  - common/vault-remember
  - common/vault-optimize
  - common/git-commit
  - common/issue-filing
  - common/working-state
  - common/vault-protocol
  - common/self-restart
  - common/agent-lifecycle
  # Removed in #11087 (post-#11049 D1-inlined; content lives in
  # references/roles/worker/instructions.md with #10360-cleanup markers):
  #   common/discussion-protocol, common/file-conventions, common/status-line,
  #   common/prohibitions, common/agent-boundaries, roles/worker/responsibility.
