# Worker agent sub-skill manifest (event-driven mode — #8697)
# compose.py loads this manifest instead of `includes.yml` when the role's
# wake mode is `event-driven` (config field `event-driven-<role>: yes` or
# global `event-driven: yes`).
#
# Per PM directive: parallel manifests, no mode-conditional logic inside
# fragments. Phase 6 (#8698) can remove polling by deleting common/ +
# includes.yml only.
#
# #8915: the event-mode L1 base lives in common-events/l1-base and is
# accompanied by four supporting fragments (cursor management, forge-read
# pattern, idle cool-down loop, comment handling). event-driven-workflow
# is now an orientation/redirect page kept first for backward-compat with
# any downstream that still expects that section header.
# #9588: the six `common-events/*` fragments are now Read at runtime by
# `common/boot-bootstrap` (the first include) rather than inlined here.
# Manifest stays as the documentation of what's wired in — compose just
# does not inline the runtime-Read fragments.
#
# Order matters — includes are resolved top-to-bottom
includes:
  - common/boot-bootstrap
  - common/context-pressure
  - common/resume-working-state
  - roles/worker/triage-issues
  - roles/worker/implement-tasks
  - common/pickup-comment-fidelity
  - common/improvement-scan
  - common/vault-remember
  - common/vault-optimize
  - common/git-commit
  - common/discussion-protocol
  - common/issue-filing
  - common/working-state
  - common/vault-protocol
  - common/file-conventions
  - common/status-line
  - common/self-restart
  - common/agent-lifecycle
  - common/prohibitions
  - common/agent-boundaries
  - roles/worker/responsibility
