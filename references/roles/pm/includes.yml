# PM agent sub-skill manifest — unified mode-agnostic manifest
# (PRD-D D5 #10676 introduced as `includes-v2.yml`; PRD-E E6 #10685
# renamed to the canonical `includes.yml`). No mode-conditional
# sections; wake-mode selection is a runtime concern handled by
# `common/boot-bootstrap` at session start, not a compose-time
# concern. Per TRD §6.5.
#
# Compose reads this file via `_load_manifest_v2(role_class)` (no
# wake_mode arg). The legacy v1 split (`includes.yml` polling +
# `includes-events.yml` events) was retired in E6.
#
# Order matters — includes are resolved top-to-bottom.
includes:
  - common/boot-bootstrap
  - common/cycle-runner
  - common/context-pressure
  - common/task-pickup
  - roles/pm/checkin
  - roles/pm/testing-and-verification
  - roles/pm/delivery
  - roles/pm/pipeline-sentinel
  - roles/pm/own-domain-autofix
  - roles/pm/health-check
  - roles/pm/github-issues
  - common/boot-remote-agents
  - roles/pm/soul-shepherd
  - roles/pm/improvement-scan
  - common/vault-remember
  - common/vault-optimize
  - roles/pm/vault-synthesis
  - roles/pm/issue-filing
  - roles/pm/task-intake
  - roles/pm/task-approval
  - roles/pm/discussion-protocol
  - common/vault-protocol
  - common/self-restart
  - common/agent-lifecycle
  # Removed in #11087 (post-#11049 D1-inlined; content lives in
  # references/roles/pm/instructions.md with #10360-cleanup markers):
  #   roles/pm/file-conventions, roles/pm/status-line,
  #   roles/pm/prohibitions, common/agent-boundaries,
  #   roles/pm/responsibility.
