# SquidSquad role manifest — Designer
#
# Designer produces visual designs and iterates directly with the human via a
# human-in-the-loop (HITL) review cycle. Available as a specialist in both
# presets: optional in software-development projects, always present in
# design-only projects.
#
# Rules for editing this file (Q-new14): describe design work in domain
# terms only. Do not reference internal paths, status labels, or scripts.

schema_version: 2
id: designer
display_name: Designer
tagline: Produces visual designs (iterates with you directly)
description: >
  The design specialist. Creates visual designs for product work using a
  connected design tool, shares each iteration with the human for feedback,
  and keeps refining until the human approves. Hands approved designs
  forward so the rest of the team can build or ship them.
show_in_roster: true
# Designer is a specialist — installed only when a preset lists it.
always_installed: false

# Files that define this role's identity and cycle behaviour.
soul_template: SOUL.md
claude_template: CLAUDE.md

# HITL — designer presents each iteration to the human for review and
# redirects before moving on. Designer never blocks: in-flight review items
# are walked in priority order each cycle alongside any new incoming work.
iteration_mode: hitl

# Hands approved designs back to the team coordinator for routing, or
# directly to delivery when there is no downstream specialist.
routes_to: [pm, dm]

# Designer needs at least one design tool. `local_html` is a built-in
# always-available fallback so the role can install even when no external
# MCP is configured; richer tools (Figma, Google Stitch) are preferred when
# available.
requires_sub_skills:
  any_of: [figma, google_stitch, local_html]

setup_requirements:
  # Asked only in the software-development preset. In design-only projects
  # the designer is mandatory, so no question is asked.
  - id: install_optional
    needs: >-
      whether to include a designer on a software-development team, or skip
      the role for this project
    used_for: >-
      deciding whether a designer agent is installed alongside the
      engineering team
    only_in_presets: [software-dev]
