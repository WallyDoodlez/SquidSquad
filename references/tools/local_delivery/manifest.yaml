# Tool manifest — local delivery
#
# Built-in fallback delivery tool. The delivery manager writes the
# delivery payload (packaged docs, changelogs, release notes, any
# supporting files) to a local directory alongside a manifest of what
# was delivered and when. Always available, no account required.

schema_version: 1
id: local_delivery
display_name: Local delivery folder
category: delivery
description: >
  Plain local-filesystem delivery. The delivery manager writes each
  shipped artifact into a per-issue folder with a manifest listing
  what was delivered and when. The human or an operator then picks up
  the folder and forwards it through whatever external channel the
  project uses (email, Drive, Slack, etc.).
provider: builtin
docs_url: null
applicable_roles:
  - dm
sub_skill: sub-skill.md
